spring:
  application:
    name: tilas-web-management
  datasource:
    url: jdbc:mysql://localhost:3306/db01
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: '123456'
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
#  profiles:
#    active: pro





mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
#spring事务管理日志
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: p-java-ai
    region: cn-beijing

# JWT 配置：secret 至少 32 字节（HS256 要求），生产环境应放到环境变量 / 配置中心
jwt:
  secret: tilas-web-management-jwt-secret-key-256bit
  expiration-hours: 12

